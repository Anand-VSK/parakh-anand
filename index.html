  function imagePreview(src) {
    return '<div class="img-prev"><img src="' + escapeHtml(src) + '" alt=""><button type="button" class="icon-btn danger" id="qf-img-del" aria-label="ચિત્ર કાઢો">' + am('delete') + '</button></div>';
  }

  function bindImageRemove() {
    var del = $('qf-img-del');
    if (del) del.addEventListener('click', function () { admin.image = null; admin.removeImage = true; $('qf-img-preview').innerHTML = ''; });
  }

  // મોટું ચિત્ર ફોનમાં જ 1200px સુધી નાનું કરો, જેથી upload અને બાળકના ફોન પર ખૂલવું ઝડપી બને.
  function onImagePicked(e) {
    var file = e.target.files[0];
    if (!file) return;
    showAdminError('qf-error', '');
    if (['image/png', 'image/jpeg', 'image/webp'].indexOf(file.type) === -1) { showAdminError('qf-error', 'ફક્ત PNG, JPG કે WebP ચિત્ર ચાલશે.'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, MAX_IMAGE_WIDTH / img.width);
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        var mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
        var dataUrl = canvas.toDataURL(mime, 0.85);
        var base64 = dataUrl.split(',')[1];
        if (base64.length > 2000000) { showAdminError('qf-error', 'ચિત્ર બહુ મોટું છે (1.5 MB થી નાનું જોઈએ).'); return; }
        admin.image = { base64: base64, mime: mime };
        admin.removeImage = false;
        $('qf-img-preview').innerHTML = imagePreview(dataUrl);
        bindImageRemove();
      };
      img.onerror = function () { showAdminError('qf-error', 'ચિત્ર ખૂલ્યું નહીં.'); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function saveQuestion(n, old) {
    var checked = document.querySelector('input[name="qf-correct"]:checked');
    var input = {
      text: $('qf-text').value, options: [0, 1, 2, 3].map(function (i) { return $('qf-opt' + i).value; }),
      correct: checked ? Number(checked.value) : -1, explanation: $('qf-expl').value, lo: $('qf-lo').value
    };
    if (old.hasTable && input.text.trim() !== old.text && !window.confirm('લખાણ બદલવાથી કોષ્ટક જતું રહેશે. આગળ વધવું છે?')) return;
    var btn = $('qf-save');
    btn.disabled = true;
    btn.innerHTML = am('progress_activity', 'spin') + 'સચવાઈ રહ્યું છે...';
    adminCall('apiSaveQuestion', admin.current.quiz.id, n, input, admin.image, !!admin.removeImage,
      n === null ? null : expectedFor(n)).then(function (r) {
      if (!r) return;
      if (!r.ok) {
        btn.disabled = false;
        btn.innerHTML = am('save') + 'સાચવો';
        showAdminError('qf-error', r.message);
        return;
      }
      admin.current.questions = r.questions;
      renderEditor();
    });
  }

  // --- Excel / Paste ---

  function renderBulk() {
    admin.bulk = null;
    $('form-slot').innerHTML =
      '<div class="admin-card"><h2>' + am('table_view') + 'Excel / Paste થી પ્રશ્નો ઉમેરો</h2>' +
        '<p class="hint">કૉલમ ક્રમ: ' + BULK_HEADERS.map(escapeHtml).join(' | ') + '. સાચો જવાબ: A–D, 1–4 કે ક–ઘ.</p>' +
        '<div class="chips"><button type="button" class="chip on" data-bulk="paste">' + am('content_paste') + 'Paste</button>' +
          '<button type="button" class="chip" data-bulk="excel">' + am('upload_file') + 'Excel ફાઇલ</button></div>' +
        '<div id="bulk-paste"><textarea id="bulk-text" class="field area" rows="6" placeholder="Excel/Google Sheet માંથી 8 કૉલમ copy કરીને અહીં paste કરો"></textarea></div>' +
        '<div id="bulk-excel" class="hidden">' +
          '<label class="file-drop">' + am('folder_open') + '<span id="bulk-file-name">.xlsx ફાઇલ પસંદ કરો</span><input type="file" id="bulk-file" accept=".xlsx,.xls"></label>' +
          '<button type="button" class="btn-link" id="bulk-template">' + am('download') + 'નમૂનો ડાઉનલોડ કરો</button>' +
        '</div>' +
        '<div class="error-card hidden" id="bulk-error"></div>' +
        '<div id="bulk-preview"></div>' +
        '<div class="row-actions"><button type="button" class="btn-ghost" id="bulk-cancel">' + am('close') + 'રદ કરો</button>' +
          '<button type="button" class="btn-primary btn-inline" id="bulk-add" disabled>' + am('cloud_upload') + 'ઉમેરો</button></div>' +
      '</div>';
    root().querySelectorAll('[data-bulk]').forEach(function (b) {
      b.addEventListener('click', function () {
        var mode = b.getAttribute('data-bulk');
        root().querySelectorAll('[data-bulk]').forEach(function (x) { x.classList.toggle('on', x === b); });
        $('bulk-paste').classList.toggle('hidden', mode !== 'paste');
        $('bulk-excel').classList.toggle('hidden', mode !== 'excel');
        if (mode === 'excel') loadXlsx(function () {});
      });
    });
    $('bulk-text').addEventListener('input', function () { showBulkPreview(parseTsv($('bulk-text').value)); });
    $('bulk-file').addEventListener('change', onBulkFile);
    $('bulk-template').addEventListener('click', downloadTemplate);
    $('bulk-cancel').addEventListener('click', function () { $('form-slot').innerHTML = ''; });
    $('bulk-add').addEventListener('click', addBulk);
    $('form-slot').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function showBulkPreview(rows) {
    var r = bulkRowsToQuestions(rows);
    admin.bulk = r;
    var byRow = {};
    r.errors.forEach(function (e) { byRow[e.row] = e.message; });
    var html = '';
    if (r.questions.length || r.errors.length) {
      html = '<p class="bulk-count">' + am(r.errors.length ? 'error' : 'task_alt') + r.questions.length + ' પ્રશ્નો ઉમેરાશે, ' + r.errors.length + ' માં ભૂલ' +
        (r.errors.length ? ' — ભૂલ સુધારો પછી જ ઉમેરાશે.' : '') + '</p>' +
        '<div class="table-wrap"><table class="summary-table"><thead><tr><th>હરોળ</th><th>પ્રશ્ન</th><th>જવાબ</th><th>સ્થિતિ</th></tr></thead><tbody>' +
        rows.map(function (cells, i) {
          var rowNo = i + 1;
          var q = r.questions.filter(function (x) { return x.row === rowNo; })[0];
          if (!q && !byRow[rowNo]) return '';
          return '<tr class="' + (byRow[rowNo] ? 'bad-row' : '') + '"><td>' + rowNo + '</td><td>' + escapeHtml(String(cells[0] || '').slice(0, 60)) + '</td>' +
            '<td>' + (q ? 'ABCD'.charAt(q.correct) : '—') + '</td><td>' + (byRow[rowNo] ? escapeHtml(byRow[rowNo]) : 'બરાબર') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    $('bulk-preview').innerHTML = html;
    $('bulk-add').disabled = !(r.questions.length && !r.errors.length);
  }

  function loadXlsx(done) {
    if (window.XLSX) { done(); return; }
    var s = document.createElement('script');
    s.src = XLSX_URL;
    s.onload = done;
    s.onerror = function () { showAdminError('bulk-error', 'Excel સાધન લોડ ન થયું. નેટ તપાસો અથવા Paste વાપરો.'); };
    document.head.appendChild(s);
  }

  function onBulkFile(e) {
    var file = e.target.files[0];
    if (!file) return;
    $('bulk-file-name').textContent = file.name;
    showAdminError('bulk-error', '');
    loadXlsx(function () {
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var wb = XLSX.read(new Uint8Array(reader.result), { type: 'array' });
          var ws = wb.Sheets[wb.SheetNames[0]];
          // raw:false — ખાનામાં જેવું દેખાય તેવું લખાણ ("1/2", "6,000"), તારીખ/નંબરમાં ફેરવ્યા વગર.
          showBulkPreview(xlsxRowsFromSheet(XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false })));
        } catch (err) {
          showAdminError('bulk-error', 'આ Excel ફાઇલ વાંચી શકાઈ નહીં.');
        }
      };
      reader.readAsArrayBuffer(file);
    });
  }

  function downloadTemplate() {
    loadXlsx(function () {
      var ws = XLSX.utils.aoa_to_sheet([
        BULK_HEADERS,
        ['25 + 17 = ?', '32', '42', '52', '41', 'B', '25 + 17 = 42', 'M501'],
        ['ભારતની રાજધાની કઈ છે?', 'મુંબઈ', 'દિલ્હી', 'કોલકાતા', 'ચેન્નાઈ', 'ખ', 'દિલ્હી ભારતની રાજધાની છે.', '']
      ]);
      ws['!cols'] = [{ wch: 40 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 10 }, { wch: 30 }, { wch: 10 }];
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'પ્રશ્નો');
      XLSX.writeFile(wb, 'પરખ-પ્રશ્નો-નમૂનો.xlsx');
    });
  }

  function addBulk() {
    var btn = $('bulk-add');
    btn.disabled = true;
    btn.innerHTML = am('progress_activity', 'spin') + 'ઉમેરાઈ રહ્યું છે...';
    var inputs = admin.bulk.questions.map(function (q) {
      return { text: q.text, options: q.options, correct: q.correct, explanation: q.explanation, lo: q.lo };
    });
    adminCall('apiAddQuestions', admin.current.quiz.id, inputs).then(function (r) {
      if (!r) return;
      if (!r.ok) {
        btn.disabled = false;
        btn.innerHTML = am('cloud_upload') + 'ઉમેરો';
        showAdminError('bulk-error', r.message);
        return;
      }
      admin.current.questions = r.questions;
      renderEditor();
    });
  }

  // --- બાળકની જેમ પૂર્વાવલોકન (જવાબ છુપા) ---

  function renderPreview(i) {
    var qs = admin.current.questions;
    var q = qs[i];
    $('form-slot').innerHTML =
      '<div class="preview-shell"><div class="preview-bar"><span>' + am('visibility') + 'બાળકને આમ દેખાશે · પ્રશ્ન ' + (i + 1) + '/' + qs.length + '</span>' +
        '<button type="button" class="icon-btn light" id="pv-close" aria-label="બંધ">' + am('close') + '</button></div>' +
        '<div class="glass-card quiz-box"><div class="q-html">' + q.html + '</div><div class="options">' +
          q.options.map(function (o, k) { return '<div class="option"><span class="opt-letter">' + 'ABCD'.charAt(k) + '</span><span>' + escapeHtml(o) + '</span></div>'; }).join('') +
        '</div><div class="quiz-nav">' +
          '<button type="button" class="btn-ghost" id="pv-prev"' + (i === 0 ? ' disabled' : '') + '>' + am('chevron_left') + 'પાછળ</button>' +
          '<button type="button" class="btn-ghost" id="pv-next"' + (i === qs.length - 1 ? ' disabled' : '') + '>આગળ' + am('chevron_right') + '</button>' +
        '</div></div></div>';
    $('pv-close').addEventListener('click', function () { $('form-slot').innerHTML = ''; });
    $('pv-prev').addEventListener('click', function () { renderPreview(i - 1); });
    $('pv-next').addEventListener('click', function () { renderPreview(i + 1); });
    $('form-slot').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
</script>

  <script>
  // પરખ – આણંદ : ડેશબોર્ડ (DDO/DPEO/DIET/BRC/CRC/શાળા) — દરેકને પોતાનો વિસ્તાર, ક્લિક કરીને નીચે જાઓ.
  var QR_URL = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  var LEVEL_LABELS = { district: 'જિલ્લો', taluka: 'તાલુકો', crc: 'ક્લસ્ટર', school: 'શાળા', student: 'બાળક' };
  var BUCKET_LABELS = ['0–30%', '31–60%', '61–80%', '81–100%'];
  var dash = { params: {}, data: null, sortKey: 'name', status: null, statusFilter: 'all' };

  function dm(name, extra) { return '<span class="ms' + (extra ? ' ' + extra : '') + '">' + name + '</span>'; }
  function dashRoot() { return $('tab-body') || $('app-home'); }
  function fmtPct(v) { return v === null || v === undefined ? '—' : v + '%'; }
  function pctClass(v) { return v === null ? '' : v < 40 ? 'low' : v <= 70 ? 'mid' : 'high'; }
  function bar(v) { return '<div class="dbar"><div class="' + pctClass(v) + '" style="width:' + (v || 0) + '%"></div></div>'; }

  routes.dash = function (data) { renderDashboard(data || {}, true); };

  // DIET: બે tab (ડેશબોર્ડ / ક્વિઝ). બાકીના અધિકારીઓ: ફક્ત ડેશબોર્ડ.
  function renderOfficialHome() {
    var isDiet = state.session.role === 'DIET';
    $('app-home').innerHTML = (isDiet
      ? '<div class="tabs light-tabs"><button type="button" class="tab active" data-home="dash">' + dm('monitoring') + 'ડેશબોર્ડ</button>' +
        '<button type="button" class="tab" data-home="quiz">' + dm('quiz') + 'ક્વિઝ</button></div>'
      : '') + '<div id="tab-body"></div>';
    document.querySelectorAll('[data-home]').forEach(function (b) {
      b.addEventListener('click', function () {
        document.querySelectorAll('[data-home]').forEach(function (x) { x.classList.toggle('active', x === b); });
        if (b.getAttribute('data-home') === 'quiz') { dash.seq = (dash.seq || 0) + 1; renderDietHome(); } else renderDashboard({}, true);
      });
    });
    renderDashboard({}, true);
  }

  function renderDashboard(params, fromHistory) {
    dash.params = params || {};
    if (!fromHistory) navPush('dash', dash.params);
    // જલદી ક્લિક કરો તો જૂનો (મોડો આવેલો) જવાબ નવી સ્ક્રીન પર ન લખાય.
    var seq = dash.seq = (dash.seq || 0) + 1;
    dash.statusFilter = 'all';
    dashRoot().innerHTML = '<div class="admin-card text-center"><div class="spinner admin-spin"></div><p class="mt-3">ડેશબોર્ડ તૈયાર થઈ રહ્યું છે...</p></div>';
    callServer('apiDashboard', getToken(), dash.params).then(function (r) {
      if (seq !== dash.seq || !$('tab-body') && !$('app-home')) return;
      if (handleExpired(r)) return;
      if (!r.ok) { dashRoot().innerHTML = '<div class="error-card">' + escapeHtml(r.message) + '</div>'; return; }
      dash.data = r;
      drawDashboard();
    });
  }

  function go(changes) {
    var p = {};
    Object.keys(dash.params).forEach(function (k) { p[k] = dash.params[k]; });
    Object.keys(changes).forEach(function (k) { p[k] = changes[k]; });
    renderDashboard(p);
  }

  function drawDashboard() {
    var d = dash.data;
    var c = d.cards;
    var subjects = [];
    d.filters.quizzes.forEach(function (q) { if (subjects.indexOf(q.subject) === -1) subjects.push(q.subject); });
    var html =
      '<div class="crumbs">' + d.path.map(function (p, i) {
        var last = i === d.path.length - 1;
        return (i ? dm('chevron_right', 'crumb-sep') : '') + (last ? '<b>' + escapeHtml(p.name) + '</b>'
          : '<button type="button" class="crumb" data-crumb="' + i + '">' + escapeHtml(p.name) + '</button>');
      }).join('') + '</div>' +
      '<div class="dash-filters">' +
        '<div class="chips">' + [['', 'બધાં ધોરણ'], ['5', 'ધોરણ 5'], ['8', 'ધોરણ 8']].map(function (o) {
          return '<button type="button" class="chip' + (String(d.filters.std || '') === o[0] ? ' on' : '') + '" data-std-f="' + o[0] + '">' + o[1] + '</button>';
        }).join('') + '</div>' +
        '<select class="field" id="f-subject"><option value="">બધા વિષય</option>' + subjects.map(function (s) {
          return '<option' + (s === d.filters.subject ? ' selected' : '') + '>' + escapeHtml(s) + '</option>';
        }).join('') + '</select>' +
        '<select class="field" id="f-quiz"><option value="">બધી ક્વિઝ</option>' + d.filters.quizzes.map(function (q) {
          return '<option value="' + escapeHtml(q.id) + '"' + (q.id === d.filters.quizId ? ' selected' : '') + '>ધો. ' + q.std + ' · ' + escapeHtml(q.title) + '</option>';
        }).join('') + '</select>' +
      '</div>' +
      '<div class="kpis">' +
        kpi('groups', 'કુલ બાળકો', c.enrolled) +
        kpi('how_to_reg', d.filters.quizId ? 'ક્વિઝ આપનાર' : 'ક્વિઝ આપનાર બાળકો', c.participants) +
        kpi('percent', 'ભાગીદારી', fmtPct(c.participation)) +
        kpi('grade', 'સરેરાશ ગુણ', fmtPct(c.avg)) +
      '</div>';

    if (!c.participants) {
      html += '<div class="admin-card text-center">' + dm('hourglass_empty', 'icon-hero') + '<p>ક્વિઝ પરિણામ હજુ નથી.</p></div>';
    } else {
      var maxB = Math.max.apply(null, c.buckets.concat([1]));
      html += '<div class="admin-card"><h2>' + dm('bar_chart') + 'ગુણ વિતરણ <small class="muted">(' + (d.filters.quizId ? 'આ ક્વિઝ' : 'બધી ક્વિઝ') + ', પહેલો પ્રયત્ન · કુલ પ્રયત્નો ' + c.attempts + ')</small></h2>' +
        c.buckets.map(function (v, i) {
          return '<div class="brow"><span>' + BUCKET_LABELS[i] + '</span><div class="dbar"><div class="b' + i + '" style="width:' + Math.round(100 * v / maxB) + '%"></div></div><b>' + v + '</b></div>';
        }).join('') + '</div>';
    }
    html += childrenTable(d) + rankingCards(d) + questionCards(d) + loCards(d);
    if (d.unit.level === 'school') html += '<div id="school-box"></div>';
    dashRoot().innerHTML = html;

    dashRoot().querySelectorAll('[data-crumb]').forEach(function (b) {
      b.addEventListener('click', function () { var p = d.path[Number(b.getAttribute('data-crumb'))]; go({ level: p.level, id: p.id }); });
    });
    dashRoot().querySelectorAll('[data-std-f]').forEach(function (b) {
      b.addEventListener('click', function () { go({ std: b.getAttribute('data-std-f'), subject: '', quizId: '' }); });
    });
    $('f-subject').addEventListener('change', function () { go({ subject: this.value, quizId: '' }); });
    $('f-quiz').addEventListener('change', function () { go({ quizId: this.value }); });
    dashRoot().querySelectorAll('[data-drill]').forEach(function (b) {
      b.addEventListener('click', function () { go({ level: b.getAttribute('data-level'), id: b.getAttribute('data-drill') }); });
    });
    dashRoot().querySelectorAll('[data-sort]').forEach(function (b) {
      b.addEventListener('click', function () { dash.sortKey = b.getAttribute('data-sort'); drawDashboard(); });
    });
    if (d.unit.level === 'school') loadSchoolBox(d.unit.id, d.filters.quizId || (d.filters.quizzes[0] || {}).id || '');
  }

  function kpi(icon, label, value) {
    return '<div class="kpi">' + dm(icon) + '<div><div class="kpi-v">' + value + '</div><div class="kpi-l">' + label + '</div></div></div>';
  }

  function childrenTable(d) {
    if (!d.children.length) return '';
    var isStudent = d.children[0].level === 'student';
    var rows = d.children.slice();
    var k = dash.sortKey;
    if (k !== 'name' && rows[0][k] !== undefined) rows.sort(function (a, b) { return (b[k] === null ? -1 : b[k]) - (a[k] === null ? -1 : a[k]); });
    return '<div class="admin-card"><h2>' + dm(isStudent ? 'person' : 'account_tree') + LEVEL_LABELS[d.children[0].level] + ' પ્રમાણે</h2>' +
      '<div class="table-wrap"><table class="summary-table dash-table"><thead><tr>' +
        '<th><button type="button" data-sort="name">નામ</button></th>' +
        (isStudent ? '<th>રોલ</th><th>પ્રયત્નો</th>' : '<th><button type="button" data-sort="participants">આપનાર</button></th><th><button type="button" data-sort="participation">ભાગીદારી</button></th>') +
        '<th><button type="button" data-sort="avg">સરેરાશ</button></th></tr></thead><tbody>' +
      rows.map(function (u) {
        var name = isStudent ? escapeHtml(u.name)
          : '<button type="button" class="drill" data-level="' + u.level + '" data-drill="' + escapeHtml(u.id) + '">' + escapeHtml(u.name) + dm('chevron_right') + '</button>';
        return '<tr><td>' + name + '</td>' +
          (isStudent ? '<td>' + u.roll + '</td><td>' + u.attempts + '</td>'
            : '<td>' + u.participants + ' / ' + u.enrolled + '</td><td>' + bar(u.participation) + fmtPct(u.participation) + '</td>') +
          '<td>' + bar(u.avg) + fmtPct(u.avg) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  function rankingCards(d) {
    if (!d.ranking || !d.ranking.top.length) return '';
    function list(items) {
      return '<ol class="rank">' + items.map(function (u) { return '<li><span>' + escapeHtml(u.name) + '</span><b>' + u.avg + '%</b></li>'; }).join('') + '</ol>';
    }
    return '<div class="rank-grid"><div class="admin-card"><h2>' + dm('trending_up') + 'ટોચના 10</h2>' + list(d.ranking.top) + '</div>' +
      '<div class="admin-card"><h2>' + dm('trending_down') + 'છેલ્લા 10</h2>' + list(d.ranking.bottom) + '</div></div>' +
      '<p class="hint">ઓછામાં ઓછા 5 બાળકોએ આપી હોય એવા એકમો જ ક્રમમાં ગણ્યા છે.</p>';
  }

  function questionCards(d) {
    if (!d.questions || !d.cards.participants) return '';
    return '<div class="admin-card"><h2>' + dm('quiz') + 'પ્રશ્ન વિશ્લેષણ <small class="muted">(અઘરા પહેલાં)</small></h2>' +
      d.questions.map(function (q) {
        return '<div class="qa">' +
          '<div class="qa-head"><span class="aq-num">' + q.n + '</span><div class="grow">' + escapeHtml(q.text).replace(/\n/g, '<br>') + '</div>' +
            '<b class="qa-pct ' + pctClass(q.pct) + '">' + fmtPct(q.pct) + '</b></div>' +
          q.optionTexts.map(function (t, k) {
            var cls = k === q.correct ? 'ok' : k === q.wrongTop ? 'bad' : '';
            return '<div class="brow opt ' + cls + '"><span>' + 'ABCD'.charAt(k) + '. ' + escapeHtml(t) + '</span><div class="dbar"><div style="width:' + q.options[k] + '%"></div></div><b>' + q.options[k] + '%</b></div>';
          }).join('') +
          (q.options[4] ? '<div class="brow opt"><span>જવાબ નહીં</span><div class="dbar"><div style="width:' + q.options[4] + '%"></div></div><b>' + q.options[4] + '%</b></div>' : '') +
          (q.wrongTop !== null && q.options[q.wrongTop] ? '<p class="warn-light">' + dm('warning') + 'સૌથી વધુ પસંદ થયેલો ખોટો વિકલ્પ: ' + 'ABCD'.charAt(q.wrongTop) + ' (' + q.options[q.wrongTop] + '%)</p>' : '') +
        '</div>';
      }).join('') + '</div>';
  }

  function loCards(d) {
    if (!d.lo || !d.lo.length || !d.cards.participants) return '';
    return '<div class="admin-card"><h2>' + dm('school') + 'LO વિશ્લેષણ</h2>' + d.lo.map(function (l) {
      return '<div class="brow"><span>' + escapeHtml(l.lo) + ' <small class="muted">(' + l.n + ' પ્રશ્ન)</small></span>' + bar(l.pct) + '<b>' + fmtPct(l.pct) + '</b></div>';
    }).join('') + '</div>';
  }

  // --- શાળા: લિંક/QR + આપી/બાકી યાદી ---

  function loadSchoolBox(dise, quizId) {
    var box = $('school-box');
    box.innerHTML = '<div class="admin-card text-center"><div class="spinner admin-spin"></div></div>';
    callServer('apiSchoolQuizStatus', getToken(), { dise: dise, quizId: quizId }).then(function (r) {
      if (handleExpired(r)) return;
      if (!r.ok) { box.innerHTML = '<div class="error-card">' + escapeHtml(r.message) + '</div>'; return; }
      dash.status = r;
      drawSchoolBox();
    });
  }

  function drawSchoolBox() {
    var r = dash.status;
    var shown = r.students.filter(function (s) { return dash.statusFilter === 'all' || s.status === dash.statusFilter; });
    var done = r.students.filter(function (s) { return s.status === 'આપી'; }).length;
    $('school-box').innerHTML =
      '<div class="admin-card"><h2>' + dm('share') + 'બાળકો માટે લિંક</h2>' +
        '<div class="link-row"><input class="field" id="kid-link" readonly value="' + escapeHtml(r.link) + '">' +
        '<button type="button" class="btn-ghost" id="copy-link">' + dm('content_copy') + 'Copy</button></div>' +
        '<div id="qr" class="qr"></div><p class="hint">બાળકો આ લિંક ખોલી ડાયસ કોડ, ધોરણ અને રોલ નંબરથી પ્રવેશ કરે.</p></div>' +
      '<div class="admin-card"><h2>' + dm('checklist') + 'ક્વિઝ આપી / બાકી</h2>' +
        '<select class="field" id="st-quiz">' + r.quizzes.map(function (q) {
          return '<option value="' + escapeHtml(q.id) + '"' + (q.id === r.quizId ? ' selected' : '') + '>ધો. ' + q.std + ' · ' + escapeHtml(q.title) + '</option>';
        }).join('') + '</select>' +
        (r.students.length
          ? '<p class="bulk-count">' + dm('how_to_reg') + done + ' / ' + r.students.length + ' બાળકોએ આપી</p>' +
            '<div class="chips">' + [['all', 'બધા'], ['આપી', 'આપી'], ['બાકી', 'બાકી']].map(function (o) {
              return '<button type="button" class="chip' + (dash.statusFilter === o[0] ? ' on' : '') + '" data-sf="' + o[0] + '">' + o[1] + '</button>';
            }).join('') + '</div>' +
            '<div class="table-wrap"><table class="summary-table"><thead><tr><th>રોલ</th><th>નામ</th><th>સ્થિતિ</th><th>પહેલો / શ્રેષ્ઠ</th></tr></thead><tbody>' +
            shown.map(function (s) {
              var doneRow = s.status === 'આપી';
              return '<tr><td>' + s.roll + '</td><td>' + escapeHtml(s.name) + '</td><td class="' + (doneRow ? 'st-done' : 'st-pending') + '">' +
                dm(doneRow ? 'check_circle' : 'pending') + s.status + '</td><td>' + (doneRow ? s.first + ' / ' + s.best + ' (' + s.total + ')' : '—') + '</td></tr>';
            }).join('') + '</tbody></table></div>'
          : '<p class="hint">આ ધોરણનાં બાળકો યાદીમાં નથી.</p>') +
      '</div>';
    $('copy-link').addEventListener('click', function () {
      var btn = this;
      var input = $('kid-link');
      input.select();
      // Google ના iframe માં clipboard API ઘણી વાર બંધ હોય છે: પહેલાં execCommand, પછી clipboard.
      var copied = false;
      try { copied = document.execCommand('copy'); } catch (e) { copied = false; }
      function done(ok) { btn.innerHTML = ok ? dm('check') + 'Copied' : dm('content_copy') + 'લિંક પસંદ થઈ છે — Ctrl+C દબાવો'; }
      if (copied) { done(true); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(input.value).then(function () { done(true); }, function () { done(false); });
      } else {
        done(false);
      }
    });
    $('st-quiz').addEventListener('change', function () { loadSchoolBox(r.school.dise, this.value); });
    document.querySelectorAll('[data-sf]').forEach(function (b) {
      b.addEventListener('click', function () { dash.statusFilter = b.getAttribute('data-sf'); drawSchoolBox(); });
    });
    drawQr(r.link);
  }

  function drawQr(link) {
    function draw() { try { $('qr').innerHTML = ''; new QRCode($('qr'), { text: link, width: 168, height: 168 }); } catch (e) {} }
    if (window.QRCode) { draw(); return; }
    var s = document.createElement('script');
    s.src = QR_URL;
    s.onload = draw;
    document.head.appendChild(s);
  }
</script>

  <script>
  // પરખ – આણંદ : client સ્ક્રીનો (લોગીન, પાસવર્ડ બદલો, હોમ)
  var TOKEN_KEY = 'parakh_token';
  var ROLE_COLORS = {
    DDO: '#b91c1c', DPEO: '#b91c1c', DIET: '#7c3aed', BRC: '#0369a1',
    CRC: '#0f766e', SCHOOL: '#c2410c', STUDENT: '#db2777'
  };
  var state = { session: null, std: null, token: null };

  function $(id) { return document.getElementById(id); }

  // token મેમરીમાં પણ રાખો: private mode માં sessionStorage ન ચાલે તો પણ લોગીન ટકે.
  function getToken() {
    if (state.token) return state.token;
    try { return sessionStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
  }
  function setToken(t) { state.token = t; try { sessionStorage.setItem(TOKEN_KEY, t); } catch (e) {} }
  function clearToken() { state.token = null; try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }

  function callServer(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve) {
      var runner = google.script.run
        .withSuccessHandler(function (r) { resolve(r || { ok: false, message: 'નેટવર્ક ભૂલ. ફરી પ્રયત્ન કરો.' }); })
        .withFailureHandler(function () { resolve({ ok: false, message: 'નેટવર્ક ભૂલ. ફરી પ્રયત્ન કરો.' }); });
      runner[fnName].apply(runner, args);
    });
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function showScreen(name) {
    ['loading', 'login', 'change', 'home'].forEach(function (n) {
      $('screen-' + n).classList.toggle('hidden', n !== name);
    });
    var official = state.session && state.session.role !== 'STUDENT' && name === 'home';
    document.body.classList.toggle('theme-official', !!official);
    document.body.classList.toggle('theme-student', !official);
    $('topbar').classList.toggle('hidden', !(state.session && (name === 'home' || name === 'change')));
    window.scrollTo(0, 0);
  }

  function setError(form, message) {
    var box = form.querySelector('[data-error]');
    box.textContent = message || '';
    box.classList.toggle('hidden', !message);
  }

  function setBusy(form, busy) {
    var btn = form.querySelector('button[type=submit]');
    if (!btn.getAttribute('data-html')) btn.setAttribute('data-html', btn.innerHTML);
    btn.disabled = busy;
    btn.innerHTML = busy ? '<span class="ms spin">progress_activity</span>ચકાસણી ચાલુ છે...' : btn.getAttribute('data-html');
  }

  function showLoginInfo(message) {
    $('login-info').textContent = message || '';
    $('login-info').classList.toggle('hidden', !message);
  }

  // --- લોગીન ---

  function selectTab(tab) {
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === tab); });
    $('form-student').classList.toggle('hidden', tab !== 'student');
    $('form-official').classList.toggle('hidden', tab !== 'official');
  }

  function selectStd(std) {
    state.std = std;
    document.querySelectorAll('.std-btn').forEach(function (b) { b.classList.toggle('selected', b.getAttribute('data-std') === std); });
  }

  function onLoggedIn(result) {
    setToken(result.token);
    state.session = result.session;
    showLoginInfo('');
    navReplace('home');
    renderTopbar();
    if (state.session.mustChange) openChange(true); else renderHome();
  }

  function submitStudent(e) {
    e.preventDefault();
    var form = e.target;
    var dise = $('st-dise').value.trim();
    var roll = $('st-roll').value.trim();
    if (!dise || !roll || !state.std) { setError(form, 'ડાયસ કોડ, ધોરણ અને રોલ નંબર બરાબર ભરો.'); return; }
    setError(form, '');
    setBusy(form, true);
    callServer('apiStudentLogin', dise, state.std, roll).then(function (r) {
      setBusy(form, false);
      if (!r.ok) { setError(form, r.message); return; }
      form.reset();
      selectStd(null);
      onLoggedIn(r);
    });
  }

  function submitOfficial(e) {
    e.preventDefault();
    var form = e.target;
    var id = $('of-id').value.trim();
    var pw = $('of-pw').value;
    if (!id || !pw) { setError(form, 'લોગીન ID અને પાસવર્ડ બંને ભરો.'); return; }
    setError(form, '');
    setBusy(form, true);
    callServer('apiLogin', id, pw).then(function (r) {
      setBusy(form, false);
      if (!r.ok) { setError(form, r.message); return; }
      form.reset();
      onLoggedIn(r);
    });
  }

  // --- પાસવર્ડ બદલો ---

  function openChange(forced) {
    $('form-change').reset();
    setError($('form-change'), '');
    $('change-note').classList.toggle('hidden', !forced);
    $('btn-change-cancel').classList.toggle('hidden', forced);
    showScreen('change');
  }

  function submitChange(e) {
    e.preventDefault();
    var form = e.target;
    var oldPw = $('ch-old').value;
    var newPw = $('ch-new').value;
    if (newPw !== $('ch-new2').value) { setError(form, 'બંને નવા પાસવર્ડ સરખા નથી.'); return; }
    setError(form, '');
    setBusy(form, true);
    callServer('apiChangePassword', getToken(), oldPw, newPw).then(function (r) {
      setBusy(form, false);
      if (r.expired) { logoutLocal(r.message); return; }
      if (!r.ok) { setError(form, r.message); return; }
      state.session = r.session;
      renderHome();
    });
  }

  // --- હોમ ---

  function scopeLine(s) {
    if (s.role === 'BRC') return 'તાલુકો: ' + s.taluka;
    if (s.role === 'CRC') return 'CRC: ' + s.crc + (s.taluka ? ' · ' + s.taluka : '');
    if (s.role === 'SCHOOL') return s.schoolName || s.name;
    if (s.role === 'STUDENT') return s.schoolName + ' · ધોરણ ' + s.std + ' · રોલ ' + s.roll;
    return 'આખો જિલ્લો';
  }

  function renderTopbar() {
    var s = state.session;
    var badge = $('role-badge');
    badge.textContent = s.roleLabel;
    badge.style.background = ROLE_COLORS[s.role] || '#475569';
    $('top-name').textContent = s.name;
    $('top-scope').textContent = scopeLine(s);
    $('btn-change').classList.toggle('hidden', s.role === 'STUDENT');
  }

  function renderHome() {
    var s = state.session;
    renderTopbar();
    showScreen('home');
    if (s.role === 'STUDENT') { renderStudentHome(); return; }
    renderOfficialHome();
  }

  // --- ફોનનું Back બટન: google.script.history (app Google ના iframe માં ચાલે છે) ---
  // દરેક મોડ્યુલ routes[view] = function (data) {...} નોંધાવે; નવી સ્ક્રીન વખતે navPush(view, data).
  // routes અને leaveGuard Index.html માં પહેલેથી જાહેર છે (StudentApp/AdminApp આ ફાઇલ પહેલાં લોડ થાય છે).

  function historyApi() {
    try { return google.script.history || null; } catch (e) { return null; }
  }
  function navPush(view, data) {
    var h = historyApi();
    if (h) try { h.push({ view: view, data: data || null }, {}, view); } catch (e) {}
  }
  function navReplace(view, data) {
    var h = historyApi();
    if (h) try { h.replace({ view: view, data: data || null }, {}, view); } catch (e) {}
  }
  function onNavChange(e) {
    if (!state.session) return;
    var st = e && e.state;
    var view = st && st.view ? st.view : 'home';
    if (routes[view]) routes[view](st ? st.data : null); else renderHome();
  }
  routes.home = function () { if (!leaveGuard || leaveGuard()) renderHome(); };

  // સર્વર "સત્ર પૂરું" કહે ત્યારે બધી સ્ક્રીન માટે એક જ જગ્યા.
  function handleExpired(r) {
    if (r && r.expired) { logoutLocal(r.message); return true; }
    return false;
  }

  function logoutLocal(message) {
    clearToken();
    state.session = null;
    showLoginInfo(message || '');
    showScreen('login');
  }

  function logout() {
    var token = getToken();
    logoutLocal('');
    if (token) callServer('apiLogout', token);
  }

  // --- શરૂઆત ---

  function init() {
    document.querySelectorAll('.tab').forEach(function (b) {
      b.addEventListener('click', function () { selectTab(b.getAttribute('data-tab')); });
    });
    document.querySelectorAll('.std-btn').forEach(function (b) {
      b.addEventListener('click', function () { selectStd(b.getAttribute('data-std')); });
    });
    document.querySelectorAll('[data-eye]').forEach(function (b) {
      b.addEventListener('click', function () {
        var input = $(b.getAttribute('data-eye'));
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        b.querySelector('.ms').textContent = show ? 'visibility_off' : 'visibility';
      });
    });
    $('form-student').addEventListener('submit', submitStudent);
    $('form-official').addEventListener('submit', submitOfficial);
    $('form-change').addEventListener('submit', submitChange);
    $('btn-logout').addEventListener('click', logout);
    $('btn-change').addEventListener('click', function () { openChange(false); });
    $('btn-change-cancel').addEventListener('click', renderHome);
    var h = historyApi();
    if (h) try { h.setChangeHandler(onNavChange); } catch (e) {}

    var token = getToken();
    if (!token) { showScreen('login'); return; }
    callServer('apiGetSession', token).then(function (r) {
      if (!r.ok) { logoutLocal(r.message); return; }
      state.session = r.session;
      if (state.session.mustChange) { renderTopbar(); openChange(true); } else renderHome();
    });
  }

  init();
</script>

</body>
</html>
