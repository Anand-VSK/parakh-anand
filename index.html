<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>પરખ – આણંદ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Gujarati:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=block" rel="stylesheet">
  <style>
  :root {
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #facc15;
    --danger-bg: rgba(220, 38, 38, .18);
    --danger-line: rgba(248, 113, 113, .6);
  }
  /* નાનો reset + વપરાતા utility classes (Tailwind CDN ની જગ્યાએ — ફોનમાં ઝડપથી ખૂલે) */
  *, ::before, ::after { box-sizing: border-box; border: 0 solid; }
  h1, h2, h3, h4, p { margin: 0; }
  button { background: transparent; color: inherit; font: inherit; padding: 0; }
  img { display: block; max-width: 100%; height: auto; }
  .flex { display: flex; } .grid { display: grid; } .relative { position: relative; }
  .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .items-center { align-items: center; } .shrink-0 { flex-shrink: 0; } .min-w-0 { min-width: 0; }
  .gap-2 { gap: .5rem; } .gap-3 { gap: .75rem; }
  .space-y-4 > * + * { margin-top: 1rem; } .space-y-5 > * + * { margin-top: 1.25rem; }
  .text-center { text-align: center; } .text-lg { font-size: 1.125rem; }
  .mt-3 { margin-top: .75rem; } .mt-4 { margin-top: 1rem; } .mb-4 { margin-bottom: 1rem; }
  .py-10 { padding-top: 2.5rem; padding-bottom: 2.5rem; } .pr-14 { padding-right: 3.5rem; }
  .min-h-screen { min-height: 100vh; }
  * { font-family: 'Anek Gujarati', sans-serif; }
  input, button, select, textarea { font-family: inherit; }
  html, body { margin: 0; overflow-x: hidden; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .hidden { display: none !important; }

  /* Material Symbols (Google Fonts) — બધા icon માટે <span class="ms">નામ</span> */
  .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 1.35em;
    line-height: 1; display: inline-block; vertical-align: middle; letter-spacing: normal; text-transform: none;
    white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; font-feature-settings: 'liga';
    font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; margin-inline-end: .3em; }
  .btn-primary .ms:last-child { margin-inline: .3em 0; }
  .eye .ms, .btn-ghost .ms:only-child { margin: 0; }
  .tab, .btn-primary, .btn-ghost, .btn-link, .card-title, .field-label { display: inline-flex; align-items: center; justify-content: center; }
  .field-label { display: flex; justify-content: flex-start; }
  .card-title { display: flex; justify-content: flex-start; }
  .icon-hero { font-size: 3.4rem; margin: 0; color: #facc15; }
  .theme-official .icon-hero { color: #4f46e5; }
  @keyframes spin-icon { to { transform: rotate(360deg); } }
  .ms.spin { animation: spin-icon 1s linear infinite; }

  /* થીમ: વિદ્યાર્થી/લોગીન = ઘેરો રંગીન; અધિકારી હોમ = હળવો */
  .theme-student { background: linear-gradient(135deg, #1e1b4b 0%, #581c87 50%, #831843 100%); background-attachment: fixed; color: #fff; }
  .theme-official { background: #f8fafc; color: var(--ink); }

  .page { width: 100%; max-width: 32rem; margin: 0 auto; padding: 0 16px 24px; flex: 1; }
  .theme-official .page { max-width: 72rem; }

  .brand { text-align: center; padding: 24px 16px 18px; }
  .brand-org { font-size: .95rem; font-weight: 600; color: #a5f3fc; margin: 0; }
  .brand-title { font-size: 3rem; line-height: 1.1; font-weight: 800; margin: 4px 0;
    background: linear-gradient(90deg, #fde047, #fb923c, #f472b6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand-sub { font-size: 1.05rem; color: #fbcfe8; margin: 0; font-weight: 500; }
  .theme-official .brand { display: none; }

  .glass-card { background: rgba(255,255,255,.10); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,.28); border-radius: 24px; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .theme-official .glass-card { background: #fff; border-color: var(--line); box-shadow: 0 6px 24px rgba(15,23,42,.06); backdrop-filter: none; }
  @keyframes glow { 0%,100% { box-shadow: 0 0 22px rgba(234,179,8,.35); } 50% { box-shadow: 0 0 36px rgba(236,72,153,.6); } }
  .glow { animation: glow 3s infinite; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: rgba(0,0,0,.25); padding: 6px; border-radius: 16px; margin-bottom: 20px; }
  .tab { min-height: 48px; border-radius: 12px; font-size: 1.05rem; font-weight: 700; color: #e9d5ff; background: transparent; border: 0; cursor: pointer; }
  .tab.active { background: linear-gradient(90deg, #facc15, #f472b6); color: #1e1b4b; }

  .field-label { display: block; font-weight: 700; color: #fbcfe8; margin-bottom: 6px; font-size: 1.02rem; }
  .theme-official .field-label { color: #334155; }
  .field { width: 100%; min-height: 52px; padding: 10px 16px; border-radius: 14px; font-size: 1.15rem;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.4); color: #fff; outline: none; }
  .field::placeholder { color: rgba(255,255,255,.6); }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(250,204,21,.35); }
  .theme-official .field { background: #fff; border-color: #cbd5e1; color: var(--ink); }
  .theme-official .field::placeholder { color: #94a3b8; }
  .hint { font-size: .88rem; color: #c4b5fd; margin: 6px 0 0; }
  .theme-official .hint { color: var(--muted); }

  .std-btn { min-height: 56px; border-radius: 14px; font-size: 1.2rem; font-weight: 800; cursor: pointer;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); color: #fff; }
  .std-btn.selected { background: linear-gradient(135deg, #22d3ee, #6366f1); border-color: #fde047; box-shadow: 0 0 0 3px rgba(253,224,71,.35); }

  .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 0; background: transparent; font-size: 1.2rem; cursor: pointer; }

  .btn-primary { width: 100%; min-height: 56px; border: 0; border-radius: 16px; cursor: pointer; font-size: 1.25rem; font-weight: 800; color: #1e1b4b;
    background: linear-gradient(90deg, #facc15, #ec4899, #8b5cf6); box-shadow: 0 10px 24px rgba(236,72,153,.35); transition: transform .15s, opacity .15s; }
  .btn-primary:active { transform: scale(.98); }
  .btn-primary:disabled { opacity: .7; cursor: wait; }
  .theme-official .btn-primary { color: #fff; background: linear-gradient(90deg, #4f46e5, #7c3aed); box-shadow: 0 8px 18px rgba(79,70,229,.25); }
  .btn-link { width: 100%; background: none; border: 0; color: inherit; opacity: .8; font-size: 1rem; cursor: pointer; min-height: 44px; }
  .btn-ghost { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-weight: 600; cursor: pointer; font-size: .98rem; }
  .theme-student .btn-ghost { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.35); color: #fff; }

  .error-card { background: var(--danger-bg); border: 1px solid var(--danger-line); color: #fecaca; border-radius: 14px; padding: 12px 14px; font-weight: 600; }
  .theme-official .error-card { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
  .info-card { background: rgba(34,211,238,.15); border: 1px solid rgba(103,232,249,.5); color: #cffafe; border-radius: 14px; padding: 12px 14px; font-weight: 600; margin-bottom: 16px; }

  .card-title { font-size: 1.5rem; font-weight: 800; margin: 0 0 6px; }

  .topbar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .theme-student .topbar { background: rgba(30,27,75,.75); backdrop-filter: blur(12px); border-color: rgba(255,255,255,.15); }
  .topbar-inner { max-width: 72rem; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .role-badge { color: #fff; font-weight: 800; border-radius: 999px; padding: 4px 12px; font-size: .9rem; white-space: nowrap; }
  .top-name { margin: 0; font-weight: 700; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-scope { margin: 0; font-size: .88rem; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 480px) { .hide-sm { display: none; } .btn-ghost .ms { margin: 0; } }

  .welcome { text-align: center; padding: 32px 20px; }
  .welcome h2 { font-size: 1.9rem; font-weight: 800; margin: 0 0 8px; }
  .welcome p { font-size: 1.1rem; margin: 0; opacity: .85; }
  .welcome .emoji { font-size: 3.2rem; }

  .spinner { width: 44px; height: 44px; margin: 0 auto; border-radius: 50%; border: 4px solid rgba(255,255,255,.25); border-top-color: #facc15; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer { text-align: center; font-size: .85rem; opacity: .6; padding: 16px; }

  /* --- વિદ્યાર્થી ક્વિઝ --- */
  .subject-title { display: flex; align-items: center; font-size: 1.25rem; font-weight: 800; margin: 18px 4px 10px; color: #fde68a; }
  .quiz-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .quiz-card { text-align: left; border-radius: 18px; padding: 14px; min-height: 84px; cursor: pointer; color: #fff;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); display: flex; flex-direction: column; gap: 6px; }
  .quiz-card:active { transform: scale(.98); }
  .quiz-card.done { background: rgba(34,197,94,.18); border-color: rgba(134,239,172,.6); }
  .quiz-set { font-size: 1.2rem; font-weight: 800; }
  .quiz-status { display: flex; align-items: center; font-size: .9rem; opacity: .9; line-height: 1.3; }
  .pending-card, .explain { display: flex; gap: 10px; align-items: center; border-radius: 16px; padding: 12px 14px; }
  .pending-card { background: rgba(250,204,21,.18); border: 1px solid rgba(253,224,71,.6); color: #fef9c3; margin-bottom: 8px; }
  .grow { flex: 1; min-width: 0; }
  .btn-small { display: inline-flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 12px; border: 0;
    background: #facc15; color: #1e1b4b; font-weight: 800; cursor: pointer; white-space: nowrap; }
  .quiz-box { padding: 18px; }
  .quiz-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 10px; }
  .pill { background: rgba(34,211,238,.22); color: #cffafe; border-radius: 999px; padding: 2px 12px; font-size: .9rem; white-space: nowrap; }
  .progress { height: 8px; background: rgba(255,255,255,.18); border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
  .progress > div { height: 100%; background: linear-gradient(90deg, #facc15, #ec4899); transition: width .3s; }
  .q-html { font-size: 1.1rem; line-height: 1.85; overflow-wrap: anywhere; margin-bottom: 14px; }
  .q-html p { margin: 0 0 10px; white-space: pre-wrap; }
  .q-html img { max-width: 100%; height: auto; display: block; margin: 10px auto; background: #fff; border-radius: 10px; padding: 6px; }
  .q-html table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: .95rem; }
  .q-html th, .q-html td { border: 1px solid rgba(255,255,255,.35); padding: 6px; text-align: center; }
  .q-html .bank-table-wrap { overflow-x: auto; }
  .options { display: grid; gap: 10px; }
  .option { display: flex; align-items: center; gap: 12px; text-align: left; min-height: 56px; padding: 10px 14px; border-radius: 14px; cursor: pointer;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.3); color: #fff; font-size: 1.08rem; }
  .option.chosen { background: rgba(219,39,119,.55); border-color: #fde047; box-shadow: 0 0 0 2px rgba(253,224,71,.4); }
  .opt-letter { width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.2); color: #fde047; font-weight: 800; }
  .quiz-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
  .quiz-nav .btn-ghost:disabled { opacity: .4; }
  .btn-inline { width: auto; min-height: 48px; padding: 0 18px; font-size: 1.05rem; }
  .review-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 14px 0; }
  .review-cell { min-height: 56px; border-radius: 12px; border: 1px solid rgba(255,255,255,.35); background: rgba(34,197,94,.25); color: #fff;
    font-weight: 800; font-size: 1.1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
  .review-cell small { font-size: .8rem; opacity: .85; }
  .review-cell.empty { background: rgba(248,113,113,.25); border-color: rgba(248,113,113,.7); }
  .warn, .okline { display: flex; align-items: center; font-weight: 700; margin: 0 0 14px; }
  .warn { color: #fecaca; } .okline { color: #bbf7d0; }
  #q-submit { margin-bottom: 6px; }
  .result-head { text-align: center; margin-bottom: 14px; }
  .result-head h2 { font-size: 1.8rem; font-weight: 800; margin: 6px 0 2px; }
  .result-head p { margin: 0; opacity: .85; }
  .review-card { border-radius: 18px; padding: 14px; margin-bottom: 12px; border: 1px solid; }
  .review-card p { margin: 4px 0; }
  .review-card.ok { background: rgba(22,163,74,.2); border-color: rgba(134,239,172,.55); }
  .review-card.bad { background: rgba(220,38,38,.18); border-color: rgba(252,165,165,.55); }
  .review-mark { display: flex; align-items: center; font-weight: 800; margin-bottom: 6px; }
  .review-card.ok .review-mark .ms { color: #4ade80; } .review-card.bad .review-mark .ms { color: #f87171; }
  .explain { align-items: flex-start; background: rgba(0,0,0,.25); margin-top: 8px; color: #fbcfe8; }
  .explain ul { margin: 4px 0 0; padding-left: 18px; }
  .explain .ms { color: #facc15; }

  /* --- DIET આયાત (હળવી થીમ) --- */
  .admin-card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: 0 6px 24px rgba(15,23,42,.06); margin-bottom: 16px; }
  .admin-card h2 { display: flex; align-items: center; font-size: 1.3rem; font-weight: 800; margin: 0 0 4px; color: var(--ink); }
  .admin-card .ms { color: #4f46e5; }
  .seg { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #eef2ff; padding: 5px; border-radius: 14px; }
  .seg button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: transparent; font-weight: 700; color: #4338ca; cursor: pointer; }
  .seg button.on { background: #4f46e5; color: #fff; }
  .file-drop { display: flex; align-items: center; gap: 10px; border: 2px dashed #c7d2fe; border-radius: 14px; padding: 14px; cursor: pointer; color: #4338ca; font-weight: 600; }
  .file-drop input { display: none; }
  .summary-table { width: 100%; border-collapse: collapse; font-size: .95rem; margin: 10px 0; }
  .summary-table th, .summary-table td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; }
  .theme-official .progress { background: #e0e7ff; }
  .import-live { display: flex; align-items: center; gap: 12px; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 14px; padding: 12px 14px; margin: 12px 0 8px; color: #312e81; }
  .admin-card .btn-primary .ms { color: #fff; }
  .import-live .ms { font-size: 1.8rem; color: #4f46e5; margin: 0; }
  .import-live small { display: block; color: #6366f1; margin-top: 2px; }
  .import-live.done { background: #f0fdf4; border-color: #bbf7d0; color: #14532d; }
  .import-live.done .ms { color: #16a34a; }
  .import-pct { font-size: 1.4rem; font-weight: 800; color: #4f46e5; }
  .import-warn { display: flex; align-items: center; color: #b45309; font-weight: 600; font-size: .95rem; margin: 0 0 8px; }
  .import-warn .ms { color: #d97706; }
  .import-log { max-height: 240px; overflow-y: auto; font-size: .92rem; background: #f8fafc; border-radius: 12px; padding: 10px; margin-top: 10px; }
  .import-log div { display: flex; align-items: center; padding: 2px 0; }
  .import-log .ok .ms { color: #16a34a; } .import-log .skip .ms { color: #64748b; } .import-log .err .ms { color: #dc2626; }
  @media (max-width: 380px) { .quiz-grid { grid-template-columns: 1fr; } }

  /* --- ડેશબોર્ડ --- */
  .light-tabs { background: #eef2ff; max-width: 420px; }
  .light-tabs .tab { color: #4338ca; }
  .light-tabs .tab.active { background: #4f46e5; color: #fff; }
  .crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; margin: 4px 0 12px; font-size: 1rem; }
  .crumb { color: #4338ca; font-weight: 700; cursor: pointer; padding: 4px 6px; border-radius: 8px; }
  .crumb:hover { background: #eef2ff; }
  .crumb-sep { color: #94a3b8; margin: 0; }
  .dash-filters { display: grid; grid-template-columns: auto 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 14px; }
  .dash-filters .chips { margin: 0; }
  @media (max-width: 720px) { .dash-filters { grid-template-columns: 1fr; } }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .kpi > .ms { font-size: 2rem; color: #4f46e5; background: #eef2ff; border-radius: 12px; padding: 6px; margin: 0; }
  .kpi-v { font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
  .kpi-l { font-size: .88rem; color: var(--muted); }
  .muted { color: var(--muted); font-weight: 500; font-size: .85rem; }
  .brow { display: grid; grid-template-columns: minmax(90px, 38%) 1fr 48px; gap: 10px; align-items: center; margin: 6px 0; font-size: .95rem; }
  .brow b { text-align: right; }
  .dbar { height: 12px; background: #f1f5f9; border-radius: 999px; overflow: hidden; min-width: 60px; }
  .dbar > div { height: 100%; background: #6366f1; border-radius: 999px; }
  .dbar .low { background: #ef4444; } .dbar .mid { background: #f59e0b; } .dbar .high { background: #22c55e; }
  .dbar .b0 { background: #ef4444; } .dbar .b1 { background: #f59e0b; } .dbar .b2 { background: #84cc16; } .dbar .b3 { background: #22c55e; }
  .dash-table td { vertical-align: middle; }
  .dash-table td .dbar { display: inline-block; width: 70px; margin-right: 8px; vertical-align: middle; }
  .dash-table th button { font-weight: 800; color: #334155; cursor: pointer; }
  .drill { display: inline-flex; align-items: center; color: #4338ca; font-weight: 700; cursor: pointer; text-align: left; }
  .drill .ms { margin: 0; font-size: 1.1em; }
  .rank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .rank-grid { grid-template-columns: 1fr; } }
  .rank { margin: 0; padding-left: 22px; } .rank li { margin: 4px 0; } .rank li span { margin-right: 8px; }
  .qa { border-top: 1px solid var(--line); padding: 12px 0; }
  .qa-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 6px; font-weight: 600; }
  .qa-pct { font-size: 1.2rem; } .qa-pct.low { color: #dc2626; } .qa-pct.mid { color: #d97706; } .qa-pct.high { color: #16a34a; }
  .brow.opt.ok span { color: #166534; font-weight: 800; } .brow.opt.ok .dbar > div { background: #22c55e; }
  .brow.opt.bad span { color: #b91c1c; font-weight: 800; } .brow.opt.bad .dbar > div { background: #ef4444; }
  .link-row { display: flex; gap: 8px; }
  .qr { margin: 12px 0; } .qr img, .qr canvas { background: #fff; padding: 8px; border-radius: 12px; border: 1px solid var(--line); }
  .st-done { color: #166534; font-weight: 700; } .st-pending { color: #b45309; font-weight: 700; }
  .st-done .ms, .st-pending .ms { font-size: 1.1em; }

  /* --- DIET ક્વિઝ મેકર --- */
  .admin-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 6px 0 12px; }
  .admin-title { display: flex; align-items: center; font-size: 1.5rem; font-weight: 800; margin: 0; }
  .admin-sub { display: flex; align-items: center; font-size: 1.15rem; font-weight: 800; margin: 0; }
  .admin-title .ms, .admin-sub .ms { color: #4f46e5; }

    var last = s.index === s.questions.length - 1;
    var html = '<div class="glass-card quiz-box">' +
      '<div class="quiz-head"><span>' + escapeHtml(s.quiz.title) + '</span><span class="pill">પ્રશ્ન ' + (s.index + 1) + '/' + s.questions.length + '</span></div>' +
      progressBar(s.index + 1, s.questions.length) +
      '<div class="q-html">' + q.html + '</div><div class="options">';
    q.options.forEach(function (opt, i) {
      html += '<button type="button" class="option' + (s.answers[s.index] === i ? ' chosen' : '') + '" data-opt="' + i + '">' +
        '<span class="opt-letter">' + 'ABCD'.charAt(i) + '</span><span>' + escapeHtml(opt) + '</span></button>';
    });
    html += '</div><div class="quiz-nav">' +
      '<button type="button" class="btn-ghost" id="q-prev"' + (s.index === 0 ? ' disabled' : '') + '>' + ms('chevron_left') + 'પાછળ</button>' +
      (last
        ? '<button type="button" class="btn-primary btn-inline" id="q-review">' + ms('fact_check') + 'જવાબો તપાસો</button>'
        : '<button type="button" class="btn-primary btn-inline" id="q-next">આગળ' + ms('chevron_right') + '</button>') +
      '</div></div>';
    home().innerHTML = html;
    home().querySelectorAll('[data-opt]').forEach(function (b) {
      b.addEventListener('click', function () {
        s.answers[s.index] = Number(b.getAttribute('data-opt'));
        home().querySelectorAll('[data-opt]').forEach(function (x) { x.classList.toggle('chosen', x === b); });
      });
    });
    $('q-prev').addEventListener('click', function () { s.index--; navPush('quiz', { index: s.index }); renderQuestion(); });
    if (last) $('q-review').addEventListener('click', function () { navPush('review'); renderReview(); });
    else $('q-next').addEventListener('click', function () { s.index++; navPush('quiz', { index: s.index }); renderQuestion(); });
    window.scrollTo(0, 0);
  }

  function renderReview() {
    var s = quizState;
    var left = s.answers.filter(function (a) { return a === null; }).length;
    var html = '<div class="glass-card quiz-box"><h2 class="card-title">' + ms('fact_check') + 'જવાબો તપાસો</h2>' +
      '<div class="review-grid">';
    s.answers.forEach(function (a, i) {
      html += '<button type="button" class="review-cell' + (a === null ? ' empty' : '') + '" data-go="' + i + '">' +
        (i + 1) + '<small>' + (a === null ? '—' : 'ABCD'.charAt(a)) + '</small></button>';
    });
    html += '</div>' +
      (left ? '<p class="warn">' + ms('warning') + left + ' પ્રશ્નોના જવાબ બાકી છે</p>' : '<p class="okline">' + ms('task_alt') + 'બધા પ્રશ્નોના જવાબ આપ્યા છે</p>') +
      '<div class="error-card hidden" id="submit-error"></div>' +
      '<button type="button" class="btn-primary" id="q-submit">' + ms('send') + 'સબમિટ કરો</button>' +
      '<button type="button" class="btn-link" id="q-back">' + ms('arrow_back') + 'પ્રશ્નો પર પાછા જાઓ</button></div>';
    home().innerHTML = html;
    home().querySelectorAll('[data-go]').forEach(function (b) {
      b.addEventListener('click', function () { s.index = Number(b.getAttribute('data-go')); navPush('quiz', { index: s.index }); renderQuestion(); });
    });
    $('q-submit').addEventListener('click', submitQuiz);
    $('q-back').addEventListener('click', function () { navPush('quiz', { index: s.index }); renderQuestion(); });
  }

  function submitQuiz() {
    var s = quizState;
    // નેટ તૂટે તો પણ જવાબો ફોનમાં રહે; એ જ attemptId થી ફરી મોકલતાં બીજું પરિણામ બનતું નથી.
    // પ્રશ્નો પણ સાચવો: ક્વિઝ પછી બંધ થઈ જાય તો પણ ફરી મોકલી પરિણામ બતાવી શકાય.
    writePending({ studentId: state.session.id, quizId: s.quiz.id, title: s.quiz.title, attemptId: s.attemptId,
      answers: s.answers, quiz: s.quiz, questions: s.questions });
    var btn = $('q-submit');
    if (btn) { btn.disabled = true; btn.innerHTML = ms('progress_activity', 'spin') + 'પરિણામ સેવ થઈ રહ્યું છે...'; }
    else home().innerHTML = loadingCard('પરિણામ સેવ થઈ રહ્યું છે...');
    callServer('apiSubmitQuiz', getToken(), s.quiz.id, s.attemptId, s.answers).then(function (r) {
      if (handleExpired(r)) return;
      if (!r.ok && r.code === 'QUIZ_UNAVAILABLE') {
        // હવે ક્યારેય સ્વીકારાશે નહીં (ક્વિઝ બંધ/બદલાઈ): જૂના જવાબો રાખવાનો અર્થ નથી.
        clearPending();
        home().innerHTML = '<div class="error-card">' + escapeHtml(r.message) + '</div>' + backButton();
        bindBack();
        return;
      }
      if (!r.ok) { showSubmitError(r.message); return; }
      clearPending();
      s.result = r.result;
      // પરિણામ પછી Back = ક્વિઝની યાદી (ફરી પ્રશ્નો પર નહીં).
      navReplace('home');
      renderResult(r.result);
    });
  }

  function showSubmitError(message) {
    if (!$('q-submit')) renderReview();
    var box = $('submit-error');
    box.innerHTML = ms('cloud_off') + 'પરિણામ મોકલાયું નથી. ' + escapeHtml(message);
    box.classList.remove('hidden');
    var btn = $('q-submit');
    btn.disabled = false;
    btn.innerHTML = ms('refresh') + 'ફરી મોકલો';
  }

  function resendPending() {
    var p = readPending();
    if (!p) return;
    if (!p.questions) { startQuiz(p.quizId, p); return; }
    quizState = { quiz: p.quiz, questions: p.questions, index: 0, answers: p.answers, attemptId: p.attemptId };
    submitQuiz();
  }

  function optionText(q, i) {
    return i === null || i === undefined ? 'જવાબ આપ્યો નથી' : 'ABCD'.charAt(i) + '. ' + escapeHtml(q.options[i]);
  }

  function renderResult(result) {
    var s = quizState;
    var html = '<div class="glass-card result-head">' + ms('emoji_events', 'icon-hero') +
      '<h2>તમારો સ્કોર ' + result.score + ' / ' + result.total + '</h2>' +
      '<p>' + escapeHtml(s.quiz.title) + ' · પ્રયત્ન ' + result.attempt + '</p></div>';
    result.review.forEach(function (rv, i) {
      var q = s.questions[i];
      html += '<div class="review-card ' + (rv.ok ? 'ok' : 'bad') + '">' +
        '<div class="review-mark">' + ms(rv.ok ? 'check_circle' : 'cancel') + 'પ્રશ્ન ' + rv.n + '</div>' +
        '<div class="q-html">' + q.html + '</div>' +
        '<p>તમારો જવાબ: <b>' + optionText(q, rv.chosen) + '</b></p>' +
        (rv.ok ? '' : '<p>સાચો જવાબ: <b>' + optionText(q, rv.correct) + '</b></p>' +
          (rv.explanation.length ? '<div class="explain">' + ms('lightbulb') + '<div><b>સમજૂતી</b><ul>' +
            rv.explanation.map(function (e) { return '<li>' + escapeHtml(e) + '</li>'; }).join('') + '</ul></div></div>' : '')) +
        '</div>';
    });
    html += '<button type="button" class="btn-primary" id="q-home">' + ms('home') + 'ક્વિઝની યાદી</button>';
    home().innerHTML = html;
    $('q-home').addEventListener('click', renderStudentHome);
    window.scrollTo(0, 0);
  }

  function backButton() {
    return '<button type="button" class="btn-link" id="q-home">' + ms('arrow_back') + 'ક્વિઝની યાદી</button>';
  }
  function bindBack() { $('q-home').addEventListener('click', renderStudentHome); }
</script>

  <script>
  // પરખ – આણંદ : DIET હોમ — જૂની e NAS HTML ફાઇલમાંથી પ્રશ્નો આયાત
  var BANK_RE = /const questionBank = (\{[\s\S]*?\});\s*\n/;
  var importState = { std: null, bank: null };

  function dietMs(name) { return '<span class="ms">' + name + '</span>'; }

  // ફાઇલના લખાણમાંથી {વિષય: {સેટ: [પ્રશ્નો]}} કાઢે; ન મળે તો null.
  function parseBank(text) {
    var m = String(text).match(BANK_RE);
    if (!m) return null;
    try {
      var bank = JSON.parse(m[1]);
      return bank && typeof bank === 'object' && Object.keys(bank).length ? bank : null;
    } catch (e) { return null; }
  }

  var IMPORT_SUBJECTS = { 5: ['ગણિત', 'પર્યાવરણ', 'ભાષાઓ'], 8: ['ગણિત', 'વિજ્ઞાન', 'ભાષા', 'સામાજિક વિજ્ઞાન'] };

  // ફાઇલના જે વિષય પસંદ કરેલા ધોરણમાં નથી (દા.ત. ધો. 8 ની ફાઇલ અને ધોરણ 5 પસંદ).
  function subjectsNotInStd(bank, std) {
    var allowed = IMPORT_SUBJECTS[std] || [];
    return Object.keys(bank).filter(function (s) { return allowed.indexOf(s) === -1; });
  }

  function bankJobs(bank) {
    var jobs = [];
    Object.keys(bank).forEach(function (subject) {
      Object.keys(bank[subject]).sort(function (a, b) { return Number(a) - Number(b); }).forEach(function (setNo) {
        jobs.push({ subject: subject, setNo: Number(setNo), questions: bank[subject][setNo] });
      });
    });
    return jobs;
  }

  // DIET હોમના નીચેના "જૂની HTML આયાત" કાર્ડમાં દોરે છે (AdminApp.html બોલાવે છે).
  function renderImportCard(container) {
    importState = { std: null, bank: null };
    container.innerHTML =
        '<p class="hint mb-4">જૂની e NAS પ્રેક્ટિસ HTML ફાઇલ પસંદ કરો. દરેક સેટ એક ક્વિઝ બનશે અને ચિત્રો Drive માં સચવાશે. એ જ ફાઇલ ફરી આયાત કરો તો કંઈ બે વાર નહીં ઉમેરાય.</p>' +
        '<div class="space-y-4">' +
          '<div><span class="field-label">' + dietMs('menu_book') + 'ધોરણ</span>' +
            '<div class="seg"><button type="button" data-istd="5">ધોરણ 5</button><button type="button" data-istd="8">ધોરણ 8</button></div></div>' +
          '<label class="file-drop">' + dietMs('folder_open') + '<span id="file-name">HTML ફાઇલ પસંદ કરો</span>' +
            '<input type="file" id="bank-file" accept=".html,.htm,text/html"></label>' +
          '<div id="bank-summary"></div>' +
          '<div class="error-card hidden" id="import-error"></div>' +
          '<button type="button" class="btn-primary" id="btn-import" disabled>' + dietMs('cloud_upload') + 'આયાત શરૂ કરો</button>' +
          '<div id="import-progress"></div>' +
        '</div>';

    document.querySelectorAll('[data-istd]').forEach(function (b) {
      b.addEventListener('click', function () {
        importState.std = Number(b.getAttribute('data-istd'));
        document.querySelectorAll('[data-istd]').forEach(function (x) { x.classList.toggle('on', x === b); });
        refreshImportButton();
      });
    });
    $('bank-file').addEventListener('change', onBankFile);
    $('btn-import').addEventListener('click', runImport);
  }

  function importError(message) {
    var box = $('import-error');
    box.textContent = message || '';
    box.classList.toggle('hidden', !message);
  }

  function refreshImportButton() {
    var wrong = importState.std && importState.bank ? subjectsNotInStd(importState.bank, importState.std) : [];
    importError(wrong.length ? 'આ ફાઇલમાં ધોરણ ' + importState.std + ' માટે ન હોય એવા વિષય છે (' + wrong.join(', ') +
      '). ધોરણ બરાબર પસંદ કરો.' : '');
    $('btn-import').disabled = !(importState.std && importState.bank) || wrong.length > 0;
  }

  function onBankFile(e) {
    var file = e.target.files[0];
    importState.bank = null;
    $('bank-summary').innerHTML = '';
    importError('');
    refreshImportButton();
    if (!file) return;
    $('file-name').textContent = file.name;
    var reader = new FileReader();
    reader.onload = function () {
      var bank = parseBank(reader.result);
      if (!bank) { importError('આ ફાઇલમાં પ્રશ્નબેંક મળી નહીં.'); return; }
      importState.bank = bank;
      var rows = Object.keys(bank).map(function (subject) {
        var sets = Object.keys(bank[subject]);
        var qs = sets.reduce(function (n, k) { return n + bank[subject][k].length; }, 0);
        return '<tr><td>' + escapeHtml(subject) + '</td><td>' + sets.length + '</td><td>' + qs + '</td></tr>';
      }).join('');
      $('bank-summary').innerHTML = '<table class="summary-table"><thead><tr><th>વિષય</th><th>સેટ</th><th>પ્રશ્નો</th></tr></thead><tbody>' + rows + '</tbody></table>';
      refreshImportButton();
    };
    reader.onerror = function () { importError('ફાઇલ વાંચી શકાઈ નહીં.'); };
    reader.readAsText(file);
  }

  function runImport() {
    var jobs = bankJobs(importState.bank);
    var std = importState.std;
    var btn = $('btn-import');
    btn.disabled = true;
    btn.innerHTML = '<span class="ms spin">progress_activity</span>આયાત ચાલુ છે...';
    $('import-progress').innerHTML =
      '<div class="import-live" id="import-live"><span class="ms spin">progress_activity</span>' +
        '<div class="grow"><b id="import-now">શરૂ થઈ રહ્યું છે...</b><small id="import-eta"></small></div>' +
        '<span class="import-pct" id="import-pct">0%</span></div>' +
      '<p class="import-warn">' + dietMs('warning') + 'આયાત પૂરી થાય ત્યાં સુધી આ પેજ બંધ ન કરો.</p>' +
      '<div class="progress"><div id="import-bar" style="width:0"></div></div>' +
      '<p id="import-count" class="hint"></p><div class="import-log" id="import-log"></div>';
    var added = 0, skipped = 0, failed = 0, images = 0;
    $('import-live').scrollIntoView({ behavior: 'smooth', block: 'center' });
    var startedAt = Date.now();
    // પેજ બંધ કરવા જાય તો browser ચેતવણી આપે.
    var guard = function (e) { e.preventDefault(); e.returnValue = ''; };
    window.addEventListener('beforeunload', guard);

    function log(cls, icon, text) {
      var line = document.createElement('div');
      line.className = cls;
      line.innerHTML = dietMs(icon) + escapeHtml(text);
      $('import-log').appendChild(line);
      $('import-log').scrollTop = 1e9;
    }

    function next(i) {
      var pct = Math.round(100 * i / jobs.length);
      $('import-bar').style.width = pct + '%';
      $('import-pct').textContent = pct + '%';
      $('import-count').textContent = i + ' / ' + jobs.length + ' સેટ પૂરા · ' + added + ' ઉમેર્યા · ' + skipped + ' પહેલેથી · ' + failed + ' ભૂલ';
      if (i > 0) {
        var left = Math.round((Date.now() - startedAt) / i * (jobs.length - i) / 1000);
        $('import-eta').textContent = left > 0 ? 'લગભગ ' + (left >= 60 ? Math.ceil(left / 60) + ' મિનિટ' : left + ' સેકન્ડ') + ' બાકી' : '';
      }
      if (i === jobs.length) {
        window.removeEventListener('beforeunload', guard);
        $('import-live').className = 'import-live done';
        $('import-live').innerHTML = dietMs('task_alt') + '<div class="grow"><b>આયાત પૂર્ણ</b><small>' +
          added + ' નવી ક્વિઝ · ' + skipped + ' પહેલેથી · ' + failed + ' ભૂલ · ' + images + ' ચિત્રો</small></div>';
        document.querySelector('.import-warn').remove();
        btn.innerHTML = dietMs('task_alt') + 'આયાત પૂર્ણ';
        log('ok', 'summarize', 'કુલ: ' + added + ' નવી ક્વિઝ, ' + skipped + ' પહેલેથી હતી, ' + failed + ' ભૂલ, ' + images + ' ચિત્રો.');
        return;
      }
      var job = jobs[i];
      var label = job.subject + ' – સેટ ' + job.setNo;
      $('import-now').textContent = (i + 1) + ' / ' + jobs.length + ' : ' + label + ' આયાત થઈ રહ્યું છે...';
      callServer('apiImportSet', getToken(), std, job.subject, job.setNo, job.questions).then(function (r) {
        if (handleExpired(r)) { window.removeEventListener('beforeunload', guard); return; }
        if (r.ok && r.status === 'added') { added++; images += r.images || 0; log('ok', 'check_circle', r.quizId + ' · ' + label + ' ઉમેર્યું'); }
        else if (r.ok) {
          skipped++;
          log(r.repaired ? 'ok' : 'skip', r.repaired ? 'build' : 'remove_done', r.quizId + ' · ' + label + ' પહેલેથી છે' +
            (r.repaired ? ' (' + r.repaired + ' ખાના સુધાર્યાં)' : ''));
        }
        else { failed++; log('err', 'error', label + ': ' + r.message); }
        next(i + 1);
      });
    }
    next(0);
  }
</script>

  <script>
  // પરખ – આણંદ : Paste/Excel માંથી પ્રશ્નો વાંચવાના શુદ્ધ ફંક્શન (browser અને Node ટેસ્ટ બંનેમાં ચાલે)
  // સર્વર (validateQuestionInput) અંતિમ તપાસ કરે છે; અહીં તો પૂર્વાવલોકનમાં ભૂલ બતાવવા પૂરતું.
  var BULK_HEADERS = ['પ્રશ્ન', 'વિકલ્પ A', 'વિકલ્પ B', 'વિકલ્પ C', 'વિકલ્પ D', 'સાચો જવાબ', 'સમજૂતી', 'LO કોડ'];
  var BULK_LETTERS = ['A', 'B', 'C', 'D'];
  var BULK_GU_LETTERS = ['ક', 'ખ', 'ગ', 'ઘ'];

  // Excel/Google Sheets નું clipboard: TAB થી કૉલમ, નવી લીટીથી હરોળ, "..." માં ખાનાની અંદરની લીટી/TAB.
  function parseTsv(text) {
    var rows = [];
    var row = [];
    var cell = '';
    var quoted = false;
    var s = String(text || '');
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      if (quoted) {
        if (ch === '"' && s.charAt(i + 1) === '"') { cell += '"'; i++; }
        else if (ch === '"') quoted = false;
        else cell += ch;
      } else if (ch === '"' && cell === '') {
        quoted = true;
      } else if (ch === '\t') {
        row.push(cell); cell = '';
      } else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && s.charAt(i + 1) === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else {
        cell += ch;
      }
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  function bulkCorrect(value) {
    var text = String(value || '').trim();
    var i = BULK_LETTERS.indexOf(text.toUpperCase());
    if (i !== -1) return i;
    i = BULK_GU_LETTERS.indexOf(text);
    if (i !== -1) return i;
    return /^[1-4]$/.test(text) ? Number(text) - 1 : -1;
  }

  function bulkProblem(q) {
    if (!q.text) return 'પ્રશ્ન ખાલી છે.';
    for (var i = 0; i < 4; i++) if (!q.options[i]) return 'વિકલ્પ ' + BULK_LETTERS[i] + ' ખાલી છે.';
    if (q.correct < 0) return 'સાચો જવાબ A, B, C કે D હોવો જોઈએ.';
    return null;
  }

  // row = paste/Excel ની હરોળ નંબર (1 થી), જેથી DIET તે જ લીટી સુધારી શકે.
  function bulkRowsToQuestions(rows) {
    var questions = [];
    var errors = [];
    rows.forEach(function (cells, idx) {
      var c = cells.map(function (x) { return String(x === null || x === undefined ? '' : x).trim(); });
      if (c.every(function (x) { return x === ''; })) return;
      if (idx === 0 && c[0] === BULK_HEADERS[0]) return;
      var q = {
        row: idx + 1,
        text: c[0] || '',
        options: [c[1] || '', c[2] || '', c[3] || '', c[4] || ''],
        correct: bulkCorrect(c[5]),
        explanation: String(c[6] || '').split(/\r?\n/).map(function (e) { return e.trim(); }).filter(function (e) { return e; }),
        lo: c[7] || ''
      };
      var problem = bulkProblem(q);
      if (problem) errors.push({ row: q.row, message: problem });
      else questions.push(q);
    });
    return { questions: questions, errors: errors };
  }

  function xlsxRowsFromSheet(sheetRows) {
    return (sheetRows || []).map(function (r) {
      return (r || []).map(function (x) { return String(x === null || x === undefined ? '' : x).trim(); });
    });
  }
</script>

  <script>
  // પરખ – આણંદ : DIET ક્વિઝ મેકર (યાદી → નવી ક્વિઝ → એડિટર → પ્રશ્ન ફોર્મ / Paste / Excel → પૂર્વાવલોકન)
  var SUBJECTS = { 5: ['ગણિત', 'પર્યાવરણ', 'ભાષાઓ'], 8: ['ગણિત', 'વિજ્ઞાન', 'ભાષા', 'સામાજિક વિજ્ઞાન'] };
  var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  var STATUS_CLASS = { 'પ્રકાશિત': 'st-pub', 'ડ્રાફ્ટ': 'st-draft', 'બંધ': 'st-closed' };
  var MAX_IMAGE_WIDTH = 1200;
  var admin = { filter: 'all', quizzes: [], current: null, image: null, bulk: null };

  function am(name, extra) { return '<span class="ms' + (extra ? ' ' + extra : '') + '">' + name + '</span>'; }
  function root() { return $('tab-body') || $('app-home'); }
  function busy(text) { return '<div class="admin-card text-center"><div class="spinner admin-spin"></div><p class="mt-3">' + text + '</p></div>'; }
  function statusBadge(s) { return '<span class="status ' + (STATUS_CLASS[s] || '') + '">' + escapeHtml(s) + '</span>'; }

  function adminCall(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return callServer.apply(null, [fn, getToken()].concat(args)).then(function (r) {
      if (handleExpired(r)) return null;
      return r;
    });
  }

  function showAdminError(id, message) {
    var box = $(id);
    if (!box) return;
    box.textContent = message || '';
    box.classList.toggle('hidden', !message);
  }

  // --- યાદી ---

  function renderDietHome() {
    admin.current = null;
    root().innerHTML =
      '<div class="admin-head"><h2 class="admin-title">' + am('quiz') + 'ક્વિઝ</h2>' +
        '<button type="button" class="btn-primary btn-inline" id="btn-new-quiz">' + am('add') + 'નવી ક્વિઝ</button></div>' +
      '<div class="chips">' + ['all', '5', '8'].map(function (f) {
        return '<button type="button" class="chip' + (admin.filter === f ? ' on' : '') + '" data-filter="' + f + '">' +
          (f === 'all' ? 'બધા' : 'ધોરણ ' + f) + '</button>';
      }).join('') + '</div>' +
      '<div id="quiz-list">' + busy('ક્વિઝ લોડ થઈ રહી છે...') + '</div>' +
      '<details class="admin-card old-import"><summary>' + am('history') + 'જૂની HTML ફાઇલમાંથી આયાત</summary><div id="import-slot"></div></details>';
    $('btn-new-quiz').addEventListener('click', renderNewQuizForm);
    root().querySelectorAll('[data-filter]').forEach(function (b) {
      b.addEventListener('click', function () { admin.filter = b.getAttribute('data-filter'); renderDietHome(); });
    });
    renderImportCard($('import-slot'));
    adminCall('apiAdminListQuizzes').then(function (r) {
      if (!r) return;
      if (!r.ok) { $('quiz-list').innerHTML = '<div class="error-card">' + escapeHtml(r.message) + '</div>'; return; }
      admin.quizzes = r.quizzes;
      renderQuizList();
    });
  }

  function renderQuizList() {
    var list = admin.quizzes.filter(function (q) { return admin.filter === 'all' || String(q.std) === admin.filter; });
    if (!list.length) {
      $('quiz-list').innerHTML = '<div class="admin-card text-center">' + am('inventory_2', 'icon-hero') + '<p>હજુ કોઈ ક્વિઝ નથી. "નવી ક્વિઝ" દબાવો.</p></div>';
      return;
    }
    $('quiz-list').innerHTML = '<div class="admin-grid">' + list.map(function (q) {
      return '<button type="button" class="admin-quiz" data-open="' + escapeHtml(q.id) + '">' +
        '<div class="aq-top"><b>' + escapeHtml(q.title) + '</b>' + statusBadge(q.status) + '</div>' +
        '<div class="aq-meta">ધોરણ ' + q.std + ' · ' + escapeHtml(q.subject) + ' · ' + escapeHtml(q.id) + '</div>' +
        '<div class="aq-meta">' + am('quiz') + q.questions + ' પ્રશ્નો &nbsp; ' + am('groups') + q.attempts + ' વાર અપાઈ</div>' +
        ((q.start || q.end) ? '<div class="aq-meta">' + am('event') + escapeHtml(q.start || '…') + ' થી ' + escapeHtml(q.end || '…') + '</div>' : '') +
        '</button>';
    }).join('') + '</div>';
    $('quiz-list').querySelectorAll('[data-open]').forEach(function (b) {
      b.addEventListener('click', function () { openEditor(b.getAttribute('data-open')); });
    });
  }

  // --- નવી ક્વિઝ ---

  function renderNewQuizForm(fromHistory) {
    if (fromHistory !== true) navPush('newquiz');
    var std = admin.filter === '5' ? 5 : 8;
    root().innerHTML =
      '<div class="admin-card"><h2>' + am('add_circle') + 'નવી ક્વિઝ</h2>' +
        '<div class="form-grid">' +
          '<label>ધોરણ<select id="nq-std" class="field"><option value="5">ધોરણ 5</option><option value="8">ધોરણ 8</option></select></label>' +
          '<label>વિષય<select id="nq-subject" class="field"></select></label>' +
          '<label>સેટ નંબર<input id="nq-set" class="field" inputmode="numeric" placeholder="આપોઆપ"></label>' +
          '<label class="span2">શીર્ષક<input id="nq-title" class="field"></label>' +
          '<label>શરૂ તારીખ<input id="nq-start" type="date" class="field"></label>' +
          '<label>અંતિમ તારીખ<input id="nq-end" type="date" class="field"></label>' +
        '</div>' +
        '<p class="hint">તારીખ ખાલી રાખશો તો પ્રકાશિત કર્યા પછી હંમેશાં ચાલુ રહેશે.</p>' +
        '<div class="error-card hidden" id="nq-error"></div>' +
        '<div class="row-actions"><button type="button" class="btn-ghost" id="nq-cancel">' + am('arrow_back') + 'પાછા</button>' +
        '<button type="button" class="btn-primary btn-inline" id="nq-save">' + am('save') + 'બનાવો</button></div>' +
      '</div>';
    $('nq-std').value = String(std);
    var titleTouched = false;
    function nextSet(subject) {
      return admin.quizzes.filter(function (q) { return q.std === Number($('nq-std').value) && q.subject === subject; })
        .reduce(function (m, q) { return Math.max(m, q.setNo); }, 0) + 1;
    }
    function refresh() {
      var subjects = SUBJECTS[$('nq-std').value];
      var current = $('nq-subject').value;
      $('nq-subject').innerHTML = subjects.map(function (s) { return '<option>' + s + '</option>'; }).join('');
      if (subjects.indexOf(current) !== -1) $('nq-subject').value = current;
      var setNo = $('nq-set').value.trim() || nextSet($('nq-subject').value);
      if (!titleTouched) $('nq-title').value = $('nq-subject').value + ' – સેટ ' + setNo;
    }
    $('nq-std').addEventListener('change', refresh);
    $('nq-subject').addEventListener('change', refresh);
    $('nq-set').addEventListener('input', refresh);
    $('nq-title').addEventListener('input', function () { titleTouched = true; });
    $('nq-cancel').addEventListener('click', renderDietHome);
    $('nq-save').addEventListener('click', function () {
      var btn = $('nq-save');
      btn.disabled = true;
      adminCall('apiCreateQuiz', {
        std: Number($('nq-std').value), subject: $('nq-subject').value, setNo: $('nq-set').value.trim(),
        title: $('nq-title').value, start: $('nq-start').value, end: $('nq-end').value
      }).then(function (r) {
        if (!r) return;
        btn.disabled = false;
        if (!r.ok) { showAdminError('nq-error', r.message); return; }
        navReplace('editor', { id: r.quiz.id });
        openEditor(r.quiz.id, true);
      });
    });
    refresh();
  }

  // --- એડિટર ---

  // Back બટન: એડિટર / નવી ક્વિઝ ફોર્મ → યાદી.
  routes.editor = function (data) { if (data && data.id) openEditor(data.id, true); else renderDietHome(); };
  routes.newquiz = function () { renderNewQuizForm(true); };

  function openEditor(quizId, fromHistory) {
    if (!fromHistory) navPush('editor', { id: quizId });
    root().innerHTML = busy('ક્વિઝ ખૂલી રહી છે...');
    adminCall('apiGetQuizForEdit', quizId).then(function (r) {
      if (!r) return;
      if (!r.ok) { root().innerHTML = '<div class="error-card">' + escapeHtml(r.message) + '</div>'; return; }
      admin.current = { quiz: r.quiz, questions: r.questions, attempts: r.attempts, canAddRemove: r.canAddRemove, lockReason: r.lockReason };
      renderEditor();
    });
  }

  function renderEditor() {
    var c = admin.current;
    var q = c.quiz;
    var actions = [];
    if (q.status !== 'પ્રકાશિત') actions.push('<button type="button" class="btn-primary btn-inline" data-status="પ્રકાશિત">' + am('publish') + 'પ્રકાશિત કરો</button>');
    if (q.status === 'પ્રકાશિત') actions.push('<button type="button" class="btn-ghost danger" data-status="બંધ">' + am('block') + 'બંધ કરો</button>');
    if (q.status === 'બંધ') actions.push('<button type="button" class="btn-ghost" data-status="ડ્રાફ્ટ">' + am('edit_note') + 'ડ્રાફ્ટ કરો</button>');
    root().innerHTML =
      '<button type="button" class="btn-link back-link" id="ed-back">' + am('arrow_back') + 'ક્વિઝની યાદી</button>' +
      '<div class="admin-card">' +
        '<div class="aq-top"><h2>' + am('edit_document') + escapeHtml(q.title) + '</h2>' + statusBadge(q.status) + '</div>' +
        '<div class="aq-meta">ધોરણ ' + q.std + ' · ' + escapeHtml(q.subject) + ' · સેટ ' + q.setNo + ' · ' + escapeHtml(q.id) + '</div>' +
        '<div class="form-grid mt-3">' +
          '<label class="span2">શીર્ષક<input id="ed-title" class="field" value="' + escapeHtml(q.title) + '"></label>' +
          '<label>શરૂ તારીખ<input id="ed-start" type="date" class="field" value="' + escapeHtml(q.start) + '"></label>' +
          '<label>અંતિમ તારીખ<input id="ed-end" type="date" class="field" value="' + escapeHtml(q.end) + '"></label>' +
        '</div>' +
        '<div class="error-card hidden" id="ed-error"></div>' +
        '<div class="row-actions wrap">' +
          '<button type="button" class="btn-ghost" id="ed-save-meta">' + am('save') + 'વિગત સાચવો</button>' +
          '<button type="button" class="btn-ghost" id="ed-preview"' + (c.questions.length ? '' : ' disabled') + '>' + am('visibility') + 'બાળકની જેમ જુઓ</button>' +
          actions.join('') +
        '</div>' +
        (c.attempts ? '<p class="warn-light">' + am('warning') + 'આ ક્વિઝ ' + c.attempts + ' વાર અપાઈ છે; જવાબ બદલવાથી જૂનું વિશ્લેષણ બદલાઈ શકે.</p>' : '') +
      '</div>' +
      '<div class="admin-head"><h3 class="admin-sub">' + am('list') + 'પ્રશ્નો (' + c.questions.length + ')</h3>' +
        (c.canAddRemove
          ? '<div class="row-actions"><button type="button" class="btn-ghost" id="ed-bulk">' + am('table_view') + 'Excel / Paste</button>' +
            '<button type="button" class="btn-primary btn-inline" id="ed-add">' + am('add_circle') + 'પ્રશ્ન ઉમેરો</button></div>'
          : '') + '</div>' +
      (c.canAddRemove ? '' : '<p class="warn-light">' + am('lock') + escapeHtml(c.lockReason) + ' પ્રશ્ન સુધારી શકાય છે.</p>') +
      '<div id="form-slot"></div>' +
      '<div id="q-list">' + (c.questions.length ? c.questions.map(questionCard).join('') :
        '<div class="admin-card text-center"><p>હજુ કોઈ પ્રશ્ન નથી. "પ્રશ્ન ઉમેરો" અથવા "Excel / Paste" વાપરો.</p></div>') + '</div>';

    $('ed-back').addEventListener('click', renderDietHome);
    if (c.canAddRemove) {
      $('ed-add').addEventListener('click', function () { renderQuestionForm(null); });
      $('ed-bulk').addEventListener('click', renderBulk);
    }
    $('ed-preview').addEventListener('click', function () { renderPreview(0); });
    $('ed-save-meta').addEventListener('click', function () {
      updateQuiz({ title: $('ed-title').value, start: $('ed-start').value, end: $('ed-end').value });
    });
    root().querySelectorAll('[data-status]').forEach(function (b) {
      b.addEventListener('click', function () { updateQuiz({ status: b.getAttribute('data-status') }); });
    });
    root().querySelectorAll('[data-edit]').forEach(function (b) {
      b.addEventListener('click', function () { renderQuestionForm(Number(b.getAttribute('data-edit'))); });
    });
    root().querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function () { deleteQuestion(Number(b.getAttribute('data-del'))); });
    });
  }

  function questionCard(q) {
    return '<div class="admin-q">' +
      '<div class="aq-num">' + q.n + '</div>' +
      '<div class="grow"><div class="aq-text">' + escapeHtml(q.text).replace(/\n/g, '<br>') + '</div>' +
        (q.imageUrl ? '<img class="aq-thumb" src="' + escapeHtml(q.imageUrl) + '" alt="">' : '') +
        (q.hasTable ? '<span class="tag">' + am('table') + 'કોષ્ટક</span>' : '') +
        '<div class="aq-opts">' + q.options.map(function (o, i) {
          return '<span class="' + (i === q.correct ? 'ok' : '') + '">' + 'ABCD'.charAt(i) + '. ' + escapeHtml(o) + '</span>';
        }).join('') + '</div></div>' +
      '<div class="aq-btns"><button type="button" class="icon-btn" data-edit="' + q.n + '" aria-label="સુધારો">' + am('edit') + '</button>' +
        (admin.current.canAddRemove ? '<button type="button" class="icon-btn danger" data-del="' + q.n + '" aria-label="કાઢો">' + am('delete') + '</button>' : '') + '</div>' +
    '</div>';
  }

  function updateQuiz(changes) {
    adminCall('apiUpdateQuiz', admin.current.quiz.id, changes).then(function (r) {
      if (!r) return;
      if (!r.ok) { showAdminError('ed-error', r.message); return; }
      admin.current.quiz = r.quiz;
      renderEditor();
    });
  }

  function deleteQuestion(n) {
    if (!window.confirm('પ્રશ્ન ' + n + ' કાઢી નાખવો છે?')) return;
    adminCall('apiDeleteQuestion', admin.current.quiz.id, n, expectedFor(n)).then(function (r) {
      if (!r) return;
      if (!r.ok) { showAdminError('ed-error', r.message); return; }
      admin.current.questions = r.questions;
      renderEditor();
    });
  }

  // સ્ક્રીન પર દેખાતો પ્રશ્ન — સર્વર ખાતરી કરે કે વચ્ચે બીજે બદલાયો નથી.
  function expectedFor(n) {
    var q = admin.current.questions.filter(function (x) { return x.n === n; })[0];
    return q ? { html: q.html, options: q.options } : null;
  }

  // --- પ્રશ્ન ફોર્મ ---

  function renderQuestionForm(n) {
    var c = admin.current;
    var q = n === null ? { text: '', options: ['', '', '', ''], correct: -1, explanation: [], lo: '', imageUrl: '', hasTable: false }
      : c.questions.filter(function (x) { return x.n === n; })[0];
    admin.image = null;
    admin.removeImage = false;
    $('form-slot').innerHTML =
      '<div class="admin-card q-form"><h2>' + am(n === null ? 'add_circle' : 'edit') + (n === null ? 'નવો પ્રશ્ન' : 'પ્રશ્ન ' + n + ' સુધારો') + '</h2>' +
        '<label class="block-label">પ્રશ્ન<textarea id="qf-text" class="field area" rows="3">' + escapeHtml(q.text) + '</textarea></label>' +
        (q.hasTable ? '<p class="warn-light">' + am('table') + 'આ પ્રશ્નમાં કોષ્ટક છે; લખાણ બદલશો તો કોષ્ટક જતું રહેશે.</p>' : '') +
        '<div class="img-row"><label class="file-drop small">' + am('add_photo_alternate') + '<span>ચિત્ર ઉમેરો</span>' +
          '<input type="file" id="qf-image" accept="image/png,image/jpeg,image/webp"></label>' +
          '<div id="qf-img-preview">' + (q.imageUrl ? imagePreview(q.imageUrl) : '') + '</div></div>' +
        '<div class="opt-grid">' + [0, 1, 2, 3].map(function (i) {
          return '<label class="opt-input"><input type="radio" name="qf-correct" value="' + i + '"' + (q.correct === i ? ' checked' : '') + '>' +
            '<span class="opt-letter">' + 'ABCD'.charAt(i) + '</span>' +
            '<input class="field" id="qf-opt' + i + '" value="' + escapeHtml(q.options[i]) + '" placeholder="વિકલ્પ ' + 'ABCD'.charAt(i) + '"></label>';
        }).join('') + '</div>' +
        '<p class="hint">સાચા જવાબ સામેનું ગોળ બટન દબાવો.</p>' +
        '<label class="block-label">સમજૂતી (દરેક લીટી એક મુદ્દો)<textarea id="qf-expl" class="field area" rows="2">' + escapeHtml(q.explanation.join('\n')) + '</textarea></label>' +
        '<label class="block-label">LO કોડ<input id="qf-lo" class="field" value="' + escapeHtml(q.lo) + '"></label>' +
        '<div class="error-card hidden" id="qf-error"></div>' +
        '<div class="row-actions"><button type="button" class="btn-ghost" id="qf-cancel">' + am('close') + 'રદ કરો</button>' +
          '<button type="button" class="btn-primary btn-inline" id="qf-save">' + am('save') + 'સાચવો</button></div>' +

    $('qf-image').addEventListener('change', onImagePicked);
    $('qf-cancel').addEventListener('click', function () { $('form-slot').innerHTML = ''; });
    $('qf-save').addEventListener('click', function () { saveQuestion(n, q); });
    $('form-slot').scrollIntoView({ behavior: 'smooth', block: 'start' });
